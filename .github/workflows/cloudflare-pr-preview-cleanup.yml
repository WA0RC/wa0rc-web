name: Clean Up Cloudflare PR Preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create trusted Wrangler configuration
        run: |
          cat > wrangler-preview.jsonc <<EOF
          {
            "name": "wa0rc-pr-${{ github.event.pull_request.number }}",
            "compatibility_date": "2026-04-19",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "."
            }
          }
          EOF

      - name: Delete preview Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --config wrangler-preview.jsonc --force