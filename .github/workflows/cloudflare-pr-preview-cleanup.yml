name: Clean Up Cloudflare PR Preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create trusted Wrangler configuration
        run: |
          cat > wrangler-preview.jsonc <<EOF
          {
            "name": "wa0rc-pr-${{ github.event.pull_request.number }}",
            "compatibility_date": "2026-04-19",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "."
            }
          }
          EOF

      - name: Delete preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --config wrangler-preview.jsonc --force