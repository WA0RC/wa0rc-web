name: Clean Up Cloudflare PR Preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: wa0rc-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}")

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "404" ]; then
            cat /tmp/delete-response.json
            echo "Cloudflare returned HTTP $HTTP_STATUS while deleting ${WORKER_NAME}" >&2
            exit 1
          fi

          echo "Preview Worker ${WORKER_NAME} deleted or was already absent (HTTP ${HTTP_STATUS})."

      # Wrangler's delete command probes KV namespaces for asset workers before
      # deleting. The direct API call above only requires Workers Scripts: Write.
      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MARKER='<!-- cloudflare-pr-preview -->'
          BODY=$(cat <<EOF
          $MARKER
          ## Cloudflare preview removed

          The preview Worker for this pull request was deleted after the pull request closed.
          EOF
          )
          COMMENT_ID=$(gh api \
            --paginate \
            "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" \
            | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "/repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              -f body="$BODY" >/dev/null
          fi