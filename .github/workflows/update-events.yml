name: Update Events and Deploy

on:
  # Uncomment the schedule below to run automatically at 6:00 AM UTC daily
  schedule:
    - cron: '0 2 * * *'

  # Run on PRs that touch event files or the script
  pull_request:
    paths:
      - 'events-upcoming.yml'
      - 'events-past.yml'
      - 'events-maintenance.yml'
      - '.github/scripts/update_events.py'
      - '.github/schemas/maintenance.json'

  # Manual trigger
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml check-jsonschema

      - name: Validate event YAML files
        run: |
          check-jsonschema --schemafile .github/schemas/events.json events-upcoming.yml
          check-jsonschema --schemafile .github/schemas/events.json events-past.yml
          check-jsonschema --schemafile .github/schemas/maintenance.json events-maintenance.yml

      - name: Run events update script
        run: python .github/scripts/update_events.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events-upcoming.yml events-past.yml events-maintenance.yml index.html
          git commit -m "chore: update events and rebuild page"
          git push
