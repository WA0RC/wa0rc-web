name: Cloudflare PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download pull request source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .preview-source /tmp/pr-source
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${PR_REPO}/zipball/${PR_SHA}" \
            > /tmp/pr-source/pr.zip
          unzip -q /tmp/pr-source/pr.zip -d /tmp/pr-source/extracted
          rsync -a /tmp/pr-source/extracted/*/ .preview-source/
          rm -rf .preview-source/.git .preview-source/.github

      - name: Create trusted Wrangler configuration
        run: |
          cat > wrangler-preview.jsonc <<EOF
          {
            "name": "wa0rc-pr-${{ github.event.pull_request.number }}",
            "compatibility_date": "2026-04-19",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "./.preview-source"
            }
          }
          EOF

      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler-preview.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          PREVIEW_URL=$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MARKER='<!-- cloudflare-pr-preview -->'
          BODY=$(cat <<EOF
          $MARKER
          ## Cloudflare preview deployed

          Preview for commit \`${{ github.event.pull_request.head.sha }}\`:

          [$PREVIEW_URL]($PREVIEW_URL)

          This preview is updated when new commits are pushed to the pull request.
          EOF
          )
          COMMENT_ID=$(gh api \
            --paginate \
            "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" \
            | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "/repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              -f body="$BODY" >/dev/null
          else
            gh api \
              --method POST \
              "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null
          fi
