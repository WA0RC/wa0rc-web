# Club station maintenance and announcements (soonest first)
# Datetimes use Central Standard Time (UTC-6).
# Date-only values mean 12:01 AM on that date.
# Use exactly one of station or repeater for each entry.
# stop-datetime is optional; description is optional.
#
# Format:
#   - station: "WA0RC-B"
#     start-datetime: "2026-09-15"
#     stop-datetime: "2026-09-16"
#     description: "Repeater maintenance"

events:
  - station: "WA0RC-B"
    start-datetime: "2026-09-15"
    stop-datetime: "2026-09-16"
    description: "Repeater maintenance"

  - repeater: "WA0RC-B"
    start-datetime: "2026-09-18 22:00:00"
    stop-datetime: "2026-09-20"
    description: "Work on ircddbgateway config"

  - station: "KD0JWD-5"
    start-datetime: "2026-09-20"

  - station: "KD0JWD"
    start-datetime: "2026-09-30"
    stop-datetime: "2026-10-05 23:00:00"
